name: Android e2e

# L'app vera su un Android 14 virtuale: si installa l'APK di debug, la si pilota dall'interno (DevTools della WebView),
# si fanno le schermate di ogni sezione e della guida, e si provano gli avvisi (quello programmato e quello dello script
# in background). Schermate, avvisi ricevuti e log restano come artifact del run.

on:
  push:
    branches: [main]
    paths: ['src/**', 'android/**', 'capacitor.config.json', 'package*.json', 'scripts/android-e2e.*', '.github/workflows/android-e2e.yml']
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: App web nel progetto Android
        run: npm run android:sync

      - name: APK di debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: KVM per l'emulatore, ffmpeg per i fotogrammi dell'avvio
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prova su Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/android-e2e.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-e2e
          path: e2e/
          if-no-files-found: warn
