name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # Build non firmate: macOS mostrerà l'avviso di sviluppatore non identificato.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: skyframe-${{ runner.os }}
          # latest*.yml e .blockmap servono agli aggiornamenti automatici
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/latest*.yml
            dist/*.blockmap
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Copia l'app web nel progetto Android
        run: npm run android:sync

      - name: Build APK
        working-directory: android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          SKYFRAME_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SKYFRAME_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SKYFRAME_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # firma con la chiave fissa dei segreti: le nuove versioni si installano sopra le vecchie
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/skyframe.jks"; export SKYFRAME_KEYSTORE="$RUNNER_TEMP/skyframe.jks"; fi
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Nome dell'APK
        run: |
          mkdir -p dist-android
          V=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/release/*.apk "dist-android/Skyframe-$V-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: skyframe-Android
          path: dist-android/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
